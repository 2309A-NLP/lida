<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问答 - RAG工单3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    height: 100vh;
    overflow: hidden;
}

/* ── 整体布局 ── */
.app-layout {
    display: flex;
    height: 100vh;
}

/* ── 侧边栏 ── */
.sidebar {
    width: 280px;
    min-width: 280px;
    background: #f7f7f8;
    border-right: 1px solid #e8e8ea;
    display: flex;
    flex-direction: column;
    transition: margin-left 0.3s ease;
}
.sidebar.hidden {
    margin-left: -280px;
}
.sidebar-header {
    padding: 16px 14px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e8e8ea;
}
.sidebar-title {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}
.sidebar-close {
    background: none; border: none; font-size: 18px; color: #888;
    cursor: pointer; padding: 4px 6px; border-radius: 6px;
}
.sidebar-close:hover { background: #e8e8ea; color: #555; }
.sidebar-new {
    margin: 12px 14px;
    padding: 8px 14px;
    background: #ffffff;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
    text-align: center;
    transition: all 0.15s;
}
.sidebar-new:hover { border-color: #2563eb; color: #2563eb; background: #f0f4ff; }
.sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
}
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.conv-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.15s;
    position: relative;
}
.conv-item:hover { background: #e8e8ea; }
.conv-item.active { background: #e0e7ff; }
.conv-item-title {
    font-size: 13px;
    font-weight: 500;
    color: #333;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
}
.conv-item-preview {
    font-size: 11px;
    color: #999;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}
.conv-item-delete {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none; border: none; color: #bbb;
    cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px;
    display: none;
}
.conv-item:hover .conv-item-delete { display: block; }
.conv-item-delete:hover { color: #ef4444; background: #fef2f2; }

/* ── 主区域 ── */
.main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}
.container {
    max-width: 768px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    width: 100%;
}

/* ── 头部 ── */
.header {
    padding: 12px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e8e8ea;
    flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-left .menu-btn {
    background: none; border: none; font-size: 20px; color: #888;
    cursor: pointer; padding: 4px; border-radius: 6px; line-height: 1;
}
.header-left .menu-btn:hover { background: #f0f0f0; color: #555; }
.header-icon {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 14px; font-weight: 700;
}
.header-title { font-size: 15px; font-weight: 600; color: #333; }
.header-sub { font-size: 11px; color: #999; }
.header-center { display: flex; align-items: center; gap: 4px; }

/* ── 语言切换 ── */
.lang-toggle {
    display: flex;
    background: #f0f0f0;
    border-radius: 18px;
    padding: 2px;
    gap: 1px;
}
.lang-btn {
    border: none; background: transparent;
    padding: 3px 10px;
    border-radius: 16px;
    font-size: 12px;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}
.lang-btn.active {
    background: #ffffff;
    color: #2563eb;
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.lang-btn:hover:not(.active) { color: #555; }

.header-actions { display: flex; gap: 6px; }
.header-btn {
    background: transparent; border: none; color: #888; font-size: 16px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px;
    transition: background 0.15s; line-height: 1;
}
.header-btn:hover { background: #f0f0f0; color: #555; }

/* ── 消息区 ── */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px 0;
    scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

/* ── 欢迎页 ── */
.welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 60vh; text-align: center;
    padding: 40px 20px; animation: fadeInUp 0.4s ease-out;
}
.welcome-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 26px; font-weight: 700;
    margin-bottom: 20px; box-shadow: 0 4px 12px rgba(37,99,235,0.25);
}
.welcome-title { font-size: 24px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
.welcome-sub { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 24px; }
.welcome-examples {
    display: flex; flex-direction: column; gap: 8px; max-width: 420px; width: 100%;
}
.welcome-example {
    background: #f7f7f8; border: 1px solid #e8e8ea; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; color: #555; cursor: pointer;
    transition: background 0.15s, border-color 0.15s; text-align: left;
    line-height: 1.4;
}
.welcome-example:hover { background: #efeff1; border-color: #2563eb; color: #333; }

/* ── 消息气泡 ── */
.message-row {
    display: flex;
    margin-bottom: 16px;
    animation: fadeInUp 0.2s ease-out;
}
.message-row.user { justify-content: flex-end; }
.message-row.assistant { justify-content: flex-start; align-items: flex-start; }
.msg-avatar {
    width: 30px; height: 30px; min-width: 30px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: white; font-size: 13px; font-weight: 600;
    margin-right: 10px; margin-top: 2px;
}
.msg-bubble {
    max-width: 78%;
    line-height: 1.7;
    font-size: 15px;
}
.msg-bubble.user {
    background: #e8f0fe;
    color: #1a1a1a;
    border-radius: 18px 18px 4px 18px;
    padding: 10px 16px;
}
.msg-bubble.assistant {
    background: transparent;
    color: #1a1a1a;
    padding: 2px 0;
}
.msg-bubble.assistant p { margin: 0.5em 0; }
.msg-bubble.assistant ul, .msg-bubble.assistant ol { padding-left: 20px; }
.msg-bubble.assistant pre {
    background: #1e1e2e; border-radius: 10px; padding: 14px 16px;
    overflow-x: auto; font-size: 13px; line-height: 1.5; margin: 10px 0;
    color: #cdd6f4;
}
.msg-bubble.assistant code {
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
}
.msg-bubble.assistant :not(pre) > code {
    background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px;
}
.msg-bubble.assistant blockquote {
    border-left: 3px solid #2563eb; padding-left: 12px; margin: 8px 0;
    color: #555; background: #f8f9ff; border-radius: 0 6px 6px 0; padding: 6px 12px;
}

/* ── 参考块区域 ── */
.ref-section {
    margin: 4px 0 6px 40px;
    font-size: 13px;
}
.ref-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #f0f4ff;
    color: #2563eb;
    border: 1px solid #dbeafe;
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s;
}
.ref-toggle:hover { background: #dbeafe; }
.ref-toggle .arrow { transition: transform 0.2s; display: inline-block; }
.ref-toggle .arrow.open { transform: rotate(90deg); }
.ref-chunks {
    display: none;
    margin-top: 6px;
    border: 1px solid #e8e8ea;
    border-radius: 8px;
    background: #fafafa;
    overflow: hidden;
}
.ref-chunks.open { display: block; }
.ref-chunk-item {
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    font-size: 12px;
    line-height: 1.4;
    transition: background 0.15s;
}
.ref-chunk-item:last-child { border-bottom: none; }
.ref-chunk-item:hover { background: #f5f5f7; }
.ref-chunk-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3px;
}
.ref-chunk-source {
    font-weight: 600;
    color: #2563eb;
    font-size: 12px;
}
.ref-chunk-page {
    background: #e8e8ea;
    color: #666;
    padding: 0 6px;
    border-radius: 4px;
    font-size: 11px;
}
.ref-chunk-score {
    color: #059669;
    font-size: 11px;
    font-weight: 500;
}
.ref-chunk-preview {
    color: #888;
    font-size: 12px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

/* ── RAG vs LLM 对比 ── */
.compare-section {
    margin: 6px 0 8px 40px;
    font-size: 13px;
}
.compare-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fef3c7;
    color: #d97706;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s;
}
.compare-toggle:hover { background: #fde68a; }
.compare-toggle .arrow { transition: transform 0.2s; display: inline-block; }
.compare-toggle .arrow.open { transform: rotate(90deg); }
.compare-panel {
    display: none;
    margin-top: 6px;
    border: 1px solid #fde68a;
    border-radius: 8px;
    overflow: hidden;
    background: #fffbeb;
}
.compare-panel.open { display: block; }
.compare-tabs {
    display: flex;
    border-bottom: 1px solid #fde68a;
}
.compare-tab {
    flex: 1;
    padding: 6px 10px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    border: none;
    color: #888;
    transition: all 0.15s;
}
.compare-tab.active {
    background: #fffbeb;
    color: #d97706;
    border-bottom: 2px solid #d97706;
}
.compare-tab:hover:not(.active) { color: #666; background: #fef9e7; }
.compare-content {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.6;
    min-height: 40px;
    max-height: 300px;
    overflow-y: auto;
}
.compare-content p { margin: 0.3em 0; }
.compare-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-bottom: 4px;
    font-weight: 500;
}
.compare-badge.rag { background: #dbeafe; color: #2563eb; }
.compare-badge.llm { background: #fef3c7; color: #d97706; }

/* ── 指标标签栏 ── */
.metrics-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin: 2px 0 4px 40px;
    padding: 4px 0;
}
.metrics-bar .tag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #f0f4ff;
    color: #2563eb;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    white-space: nowrap;
}
.metrics-bar .tag .label { color: #888; }
.metrics-bar .tag.green { background: #ecfdf5; color: #059669; }
.metrics-bar .tag.orange { background: #fff7ed; color: #ea580c; }
.metrics-bar .tag.purple { background: #f5f3ff; color: #7c3aed; }
.metrics-bar .tag.red { background: #fef2f2; color: #dc2626; }

/* ── 打字光标 ── */
.cursor {
    display: inline-block; width: 2px; height: 16px;
    background: #2563eb; margin-left: 1px;
    animation: blink 1s step-end infinite; vertical-align: text-bottom;
}

/* ── 加载动画 ── */
.loading-dots { display: flex; gap: 4px; align-items: center; padding: 8px 0; }
.loading-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2563eb; display: inline-block;
    animation: dotBounce 1.4s ease-in-out infinite;
}
.loading-dots span:nth-child(1) { animation-delay: 0s; }
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ── 底部输入 ── */
.input-area {
    padding: 12px 20px 16px;
    border-top: 1px solid #e8e8ea;
    background: #ffffff;
    flex-shrink: 0;
}
.input-wrap {
    display: flex; align-items: center;
    background: #f5f5f5;
    border: 1px solid #d9d9d9;
    border-radius: 24px;
    padding: 4px 4px 4px 18px;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.input-wrap:focus-within {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
    background: #ffffff;
}
.input-wrap textarea {
    flex: 1;
    border: none; outline: none; background: transparent;
    font-size: 15px; line-height: 1.5; resize: none;
    padding: 8px 0; max-height: 120px;
    font-family: inherit; color: #1a1a1a;
}
.input-wrap textarea::placeholder { color: #aaa; }
.send-btn {
    width: 36px; height: 36px; min-width: 36px;
    background: #2563eb; color: white;
    border: none; border-radius: 50%;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, opacity 0.15s;
}
.send-btn:hover { background: #1d4ed8; }
.send-btn:disabled { background: #d9d9d9; cursor: not-allowed; }

/* ── 动画 ── */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
}
@keyframes blink { 50% { opacity: 0; } }

@media (max-width: 640px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; box-shadow: 2px 0 12px rgba(0,0,0,0.1); }
    .msg-bubble { max-width: 90%; }
    .messages { padding: 16px 12px 0; }
    .input-area { padding: 10px 12px 12px; }
    .header { padding: 10px 12px 6px; }
    .metrics-bar { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app-layout">
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">对话历史</span>
            <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
        </div>
        <div class="sidebar-new" onclick="newChat()">+ 新对话</div>
        <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <!-- 主区域 -->
    <div class="main-area">
        <div class="container">
            <!-- 头部 -->
            <div class="header">
                <div class="header-left">
                    <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
                    <div class="header-icon">AI</div>
                    <div>
                        <div class="header-title">智能问答</div>
                        <div class="header-sub">基于招股说明书知识库</div>
                    </div>
                </div>
                <div class="header-center">
                    <div class="lang-toggle" id="langToggle">
                        <button class="lang-btn active" data-lang="" onclick="setLanguage(this)">自动</button>
                        <button class="lang-btn" data-lang="zh" onclick="setLanguage(this)">中文</button>
                        <button class="lang-btn" data-lang="en" onclick="setLanguage(this)">English</button>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="header-btn" onclick="newChat()" title="新对话">+</button>
                </div>
            </div>

            <!-- 消息区 -->
            <div class="messages" id="messages">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">AI</div>
                    <div class="welcome-title">有什么可以帮你的？</div>
                    <div class="welcome-sub">基于两份招股说明书知识库 · 支持中英文问答 · 自动评估精度</div>
                    <div class="welcome-examples">
                        <div class="welcome-example" onclick="askExample(this)">武汉力源信息技术股份有限公司本次发行股数是多少？</div>
                        <div class="welcome-example" onclick="askExample(this)">武汉兴图新科电子股份有限公司的主营业务是什么？</div>
                        <div class="welcome-example" onclick="askExample(this)">What is the registered capital of Wuhan Xingtu Xinke?</div>
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-wrap">
                    <textarea id="input" rows="1" placeholder="输入您的问题..."
                        onkeydown="onInputKeydown(event)"
                        oninput="autoResize(this)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#10148;</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ── 状态 ──
let history = [];
let isStreaming = false;
let currentConvId = null;
let sideBarVisible = true;

// ── 工具 ──
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollBottom() {
    const msgs = document.getElementById('messages');
    setTimeout(() => { msgs.scrollTop = msgs.scrollHeight; }, 50);
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function markdownToHtml(text) {
    let html = escapeHtml(text);
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^- ([^\n]+)/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    html = html.replace(/^\d+\. ([^\n]+)/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => m.includes('<ul>') ? m : '<ol>' + m + '</ol>');
    html = html.replace(/^> ([^\n]+)/gm, '<blockquote>$1</blockquote>');
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';
    html = html.replace(/<p><\/p>/g, '');
    return html;
}

// ── 侧边栏 ──
function toggleSidebar() {
    sideBarVisible = !sideBarVisible;
    document.getElementById('sidebar').classList.toggle('hidden', !sideBarVisible);
}

async function refreshSidebarList() {
    const list = document.getElementById('sidebarList');
    try {
        const resp = await fetch('/api/history/list', { method: 'POST', headers: {'Content-Type': 'application/json'} });
        const data = await resp.json();
        list.innerHTML = '';
        for (const c of data.conversations) {
            const div = document.createElement('div');
            div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
            div.innerHTML = '<div class="conv-item-title">' + escapeHtml(c.title) +
                '</div><div class="conv-item-preview">' + escapeHtml(c.preview || '') +
                ' · ' + c.msg_count + '条消息</div>' +
                '<button class="conv-item-delete" onclick="deleteConv(\'' + c.id + '\', event)">&times;</button>';
            div.onclick = () => loadConversation(c.id);
            list.appendChild(div);
        }
    } catch (e) {
        list.innerHTML = '<div style="padding:12px;color:#999;font-size:13px;text-align:center;">加载失败</div>';
    }
}

async function deleteConv(id, event) {
    event.stopPropagation();
    if (!confirm('删除此对话？')) return;
    try {
        await fetch('/api/history/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        if (currentConvId === id) {
            newChat();
        }
        refreshSidebarList();
    } catch (e) {}
}

// ── 对话管理 ──
function generateConvId() {
    return 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

async function saveCurrentConversation() {
    if (history.length === 0) return;
    if (!currentConvId) {
        currentConvId = generateConvId();
    }
    try {
        const title = history[0]?.content?.slice(0, 50) || '对话 ' + currentConvId.slice(-8);
        await fetch('/api/history/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: currentConvId, messages: history, title: title})
        });
        refreshSidebarList();
    } catch (e) {}
}

async function loadConversation(id) {
    if (isStreaming) return;
    try {
        const resp = await fetch('/api/history/get', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        const data = await resp.json();
        const conv = data.conversation;
        currentConvId = conv.id;
        history = conv.messages || [];

        // 渲染消息
        const msgs = document.getElementById('messages');
        msgs.innerHTML = '';
        hideWelcome();

        for (const msg of history) {
            if (msg.role === 'user') {
                addUserMessage(msg.content, false);
            } else if (msg.role === 'assistant') {
                addAssistantMessage(false);
                const rows = msgs.querySelectorAll('.message-row.assistant');
                const lastRow = rows[rows.length - 1];
                const bubble = lastRow.querySelector('.msg-bubble');
                if (bubble) bubble.innerHTML = markdownToHtml(msg.content);
            }
        }
        scrollBottom();
        refreshSidebarList();
    } catch (e) {}
}

// ── 语言切换 ──
function setLanguage(btn) {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function getTargetLanguage() {
    const active = document.querySelector('.lang-btn.active');
    return active ? active.getAttribute('data-lang') || null : null;
}

// ── 界面控制 ──
function showWelcome() {
    const el = document.getElementById('welcome');
    if (el) el.style.display = '';
}

function hideWelcome() {
    const el = document.getElementById('welcome');
    if (el) el.style.display = 'none';
}

function newChat() {
    saveCurrentConversation();
    history = [];
    currentConvId = null;
    cancelStream();
    document.getElementById('messages').innerHTML =
        '<div class="welcome" id="welcome">' +
        '    <div class="welcome-icon">AI</div>' +
        '    <div class="welcome-title">有什么可以帮你的？</div>' +
        '    <div class="welcome-sub">基于两份招股说明书知识库 · 支持中英文问答 · 自动评估精度</div>' +
        '    <div class="welcome-examples">' +
        '        <div class="welcome-example" onclick="askExample(this)">武汉力源信息技术股份有限公司本次发行股数是多少？</div>' +
        '        <div class="welcome-example" onclick="askExample(this)">武汉兴图新科电子股份有限公司的主营业务是什么？</div>' +
        '        <div class="welcome-example" onclick="askExample(this)">What is the registered capital of Wuhan Xingtu Xinke?</div>' +
        '    </div>' +
        '</div>';
    document.getElementById('input').value = '';
    document.getElementById('input').focus();
    refreshSidebarList();
}

function askExample(el) {
    document.getElementById('input').value = el.textContent.trim();
    sendMessage();
}

function addMessage(role, contentHtml, scroll = true) {
    hideWelcome();
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'message-row ' + role;
    if (role === 'assistant') {
        row.innerHTML = '<div class="msg-avatar">AI</div>' +
            '<div class="msg-bubble assistant">' + contentHtml + '</div>';
    } else {
        row.innerHTML = '<div class="msg-bubble user">' + contentHtml + '</div>';
    }
    msgs.appendChild(row);
    if (scroll) scrollBottom();
    return row;
}

function addAssistantMessage(loading = true) {
    hideWelcome();
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'message-row assistant';
    if (loading) {
        row.innerHTML = '<div class="msg-avatar">AI</div>' +
            '<div class="msg-bubble assistant"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
    } else {
        row.innerHTML = '<div class="msg-avatar">AI</div>' +
            '<div class="msg-bubble assistant"></div>';
    }
    msgs.appendChild(row);
    scrollBottom();
    return row;
}

function addUserMessage(text, scroll = true) {
    hideWelcome();
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'message-row user';
    row.innerHTML = '<div class="msg-bubble user">' + escapeHtml(text) + '</div>';
    msgs.appendChild(row);
    if (scroll) scrollBottom();
}

function cancelStream() {
    isStreaming = false;
}

function addMetricsBar(container, meta) {
    const bar = document.createElement('div');
    bar.className = 'metrics-bar';

    // 响应时间
    const timeMs = (meta.retrieve_time * 1000).toFixed(0);
    bar.innerHTML += '<span class="tag purple"><span class="label">⏱ 响应</span> ' + timeMs + 'ms</span>';

    // 参考块数
    bar.innerHTML += '<span class="tag">' + meta.num_chunks + ' 个参考块</span>';

    // 语言
    const langText = meta.target_language ?
        (meta.target_language === 'zh' ? '中文回答' : 'English') :
        (meta.language === 'zh' ? '中文' : 'English');
    bar.innerHTML += '<span class="tag">' + langText + '</span>';

    // 精确率
    const precisionVal = meta.precision_pct || 0;
    const precClass = precisionVal >= 80 ? 'green' : (precisionVal >= 50 ? 'orange' : 'red');
    bar.innerHTML += '<span class="tag ' + precClass + '"><span class="label">精确率</span> ' + precisionVal + '%</span>';

    // 召回率
    const recallVal = meta.recall_pct || 0;
    const recClass = recallVal >= 80 ? 'green' : (recallVal >= 50 ? 'orange' : 'red');
    bar.innerHTML += '<span class="tag ' + recClass + '"><span class="label">召回率</span> ' + recallVal + '%</span>';

    // F1
    const f1Val = meta.f1_score || 0;
    const f1Class = f1Val >= 80 ? 'green' : (f1Val >= 50 ? 'orange' : 'red');
    bar.innerHTML += '<span class="tag ' + f1Class + '"><span class="label">F1</span> ' + f1Val + '</span>';

    // 关键词数
    bar.innerHTML += '<span class="tag"><span class="label">关键词</span> ' + (meta.keyword_count || 0) + '</span>';

    container.appendChild(bar);
}

// ── 参考块展开/收起 ──
function toggleRefs(btn) {
    const chunks = btn.nextElementSibling;
    const arrow = btn.querySelector('.arrow');
    if (chunks) {
        chunks.classList.toggle('open');
    }
    if (arrow) {
        arrow.classList.toggle('open');
    }
}

// ── RAG vs LLM 对比切换 ──
function toggleCompare(btn) {
    const panel = btn.nextElementSibling;
    const arrow = btn.querySelector('.arrow');
    if (panel) {
        panel.classList.toggle('open');
    }
    if (arrow) {
        arrow.classList.toggle('open');
    }
}

function switchCompareTab(btn, idx) {
    const panel = btn.closest('.compare-panel');
    if (!panel) return;
    // 切换tab样式
    panel.querySelectorAll('.compare-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    // 切换内容
    const contents = panel.querySelectorAll('.compare-content');
    contents.forEach((c, i) => {
        c.style.display = i === idx ? 'block' : 'none';
    });
}

// ── 发送消息 ──
function sendMessage() {
    if (isStreaming) return;

    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';

    // 显示用户消息
    addUserMessage(text);

    // 显示AI加载状态
    const assistantRow = addAssistantMessage(true);
    const avatar = assistantRow.querySelector('.msg-avatar');
    const bubble = assistantRow.querySelector('.msg-bubble');

    isStreaming = true;
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;

    // SSE请求
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/chat/stream', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.responseType = '';

    let fullText = '';
    let metaReceived = false;
    let lastReferencesData = null; // store references for comparison section

    xhr.onprogress = function() {
        const lines = xhr.responseText.split('\n');
        for (const line of lines) {
            if (line.startsWith('data: ')) {
                try {
                    const data = JSON.parse(line.slice(6));

                    if (data.type === 'meta') {
                        // 移除加载动画
                        if (bubble) {
                            bubble.innerHTML = '';
                        }
                        // 添加指标栏
                        addMetricsBar(assistantRow, data);
                        metaReceived = true;
                    }

                    if (data.type === 'references') {
                        // 在气泡下添加参考块区域
                        lastReferencesData = data;
                        const refSection = document.createElement('div');
                        refSection.className = 'ref-section';
                        let html = '<div class="ref-toggle" onclick="toggleRefs(this)">'
                            + '<span class="arrow">&#9654;</span> 查看参考块 ('
                            + data.chunks.length + ' 个)'
                            + '</div>'
                            + '<div class="ref-chunks">';
                        for (const c of data.chunks) {
                            const pageText = c.page ? ' · 第' + c.page + '页' : '';
                            html += '<div class="ref-chunk-item">'
                                + '<div class="ref-chunk-header">'
                                + '<span class="ref-chunk-source">' + escapeHtml(c.source) + '</span>'
                                + '<span><span class="ref-chunk-page">' + pageText + '</span>'
                                + ' <span class="ref-chunk-score">' + (c.score * 100).toFixed(0) + '%</span></span>'
                                + '</div>'
                                + '<div class="ref-chunk-preview">' + escapeHtml(c.preview) + '</div>'
                                + '</div>';
                        }
                        html += '</div>';
                        refSection.innerHTML = html;
                        assistantRow.appendChild(refSection);
                        scrollBottom();
                    }

                    if (data.type === 'token' && data.content) {
                        if (bubble) {
                            fullText += data.content;
                            bubble.innerHTML = markdownToHtml(fullText) + '<span class="cursor"></span>';
                            scrollBottom();
                        }
                    }

                    if (data.type === 'done') {
                        if (bubble) {
                            bubble.innerHTML = markdownToHtml(fullText);
                            scrollBottom();
                        }

                        // 添加 RAG vs LLM 对比区域
                        if (data.llm_only_text && data.llm_only_text.trim()) {
                            const compareSection = document.createElement('div');
                            compareSection.className = 'compare-section';
                            const llmText = data.llm_only_text;
                            const escRag = escapeHtml(fullText);
                            const escLlm = escapeHtml(llmText);
                            compareSection.innerHTML = '<div class="compare-toggle" onclick="toggleCompare(this)">'
                                + '<span class="arrow">&#9654;</span> RAG vs 纯LLM对比'
                                + '</div>'
                                + '<div class="compare-panel">'
                                + '<div class="compare-tabs">'
                                + '<button class="compare-tab active" onclick="switchCompareTab(this, 0)">RAG (有检索)</button>'
                                + '<button class="compare-tab" onclick="switchCompareTab(this, 1)">纯LLM (无检索)</button>'
                                + '</div>'
                                + '<div class="compare-content" id="compareRag-' + Date.now() + '">'
                                + '<span class="compare-badge rag">RAG</span>'
                                + markdownToHtml(fullText)
                                + '</div>'
                                + '<div class="compare-content" id="compareLlm-' + Date.now() + '" style="display:none">'
                                + '<span class="compare-badge llm">纯LLM</span>'
                                + markdownToHtml(llmText)
                                + '</div>'
                                + '</div>';
                            assistantRow.appendChild(compareSection);
                            scrollBottom();
                        }

                        history.push({role: 'user', content: text});
                        history.push({role: 'assistant', content: fullText});
                        if (history.length > 20) {
                            history = history.slice(-20);
                        }
                        // 自动保存对话
                        saveCurrentConversation();
                        isStreaming = false;
                        sendBtn.disabled = false;
                    }
                } catch(e) {}
            }
        }
    };

    xhr.onerror = function() {
        if (bubble) {
            bubble.innerHTML = '<p>网络请求失败，请检查网络后重试</p>';
            scrollBottom();
        }
        isStreaming = false;
        sendBtn.disabled = false;
    };

    const body = JSON.stringify({
        query: text,
        history: history.slice(-10),
        target_language: getTargetLanguage()
    });
    xhr.send(body);
}

function onInputKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

// ── 初始化 ──
document.getElementById('input').focus();
refreshSidebarList();
</script>
